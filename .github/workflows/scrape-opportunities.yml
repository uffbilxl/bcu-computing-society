name: Scrape opportunities

on:
  schedule:
    # Every 12 hours. GitHub Actions cron is UTC and best-effort — actual
    # trigger time can drift by a few minutes under load.
    - cron: '0 */12 * * *'
  workflow_dispatch: {} # allows a manual "Run workflow" trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Paginating all three sources takes the raw haul from ~180 to ~800
    # listings, and Gemini's free tier caps us at 5 requests/min (13s between
    # batches in structure.ts), so ~68 batches alone need ~15 min. 30 was cutting
    # it close enough that a single 429 backoff would time the run out.
    # LinkedIn then adds ~12 min of throttled requests and ~200 more listings
    # (~17 more Gemini batches, ~4 min), so 60 no longer left that margin.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run scrape + import pipeline
        run: npm run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
